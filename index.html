<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATIVVO — Seu negócio sempre em movimento</title>
<meta name="theme-color" content="#0E1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0E1220;
  --surface:#161B2E;
  --surface-2:#1E2440;
  --surface-3:#252C4C;
  --border:#2A3152;
  --text:#EDEFF7;
  --muted:#8D94AF;
  --primary:#2FD4B0;
  --primary-dark:#1FA98A;
  --primary-ink:#06251F;
  --warn:#F5A623;
  --danger:#FF6B6B;
  --info:#5B8DEF;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --font-display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 80% -10%, #16203a 0%, var(--bg) 55%) fixed;
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
a{color:inherit;}
::selection{background:var(--primary);color:var(--primary-ink);}

/* ---- App shell ---- */
#clientAppRoot{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding-bottom:88px;
}
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 14px;
  background:linear-gradient(180deg, rgba(14,18,32,.97) 70%, rgba(14,18,32,0));
  backdrop-filter:blur(6px);
}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.brand .mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--info));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:800; color:#06131f; font-size:15px;
}
.brand .tag{font-size:11px;color:var(--muted); margin-top:1px;}
.brand h1{font-size:18px;}
.iconbtn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex;align-items:center;justify-content:center;
  position:relative;
}
.iconbtn .dot{
  position:absolute; top:6px; right:6px; width:8px;height:8px;border-radius:50%;
  background:var(--danger); border:2px solid var(--bg); display:none;
}
.iconbtn .dot.show{display:block;}

main{flex:1; padding:4px 20px 24px;}
.screen{display:none; animation:fade .18s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-title{
  display:flex; align-items:center; justify-content:space-between;
  margin:22px 0 10px;
}
.section-title h2{font-size:15px; color:var(--text);}
.section-title .link{font-size:12.5px; color:var(--primary); font-weight:600; border:none; background:none; padding:0;}
.section-title .count{font-size:12px; color:var(--muted); font-weight:500;}

.date-line{color:var(--muted); font-size:13px; margin-top:-4px;}

/* cards */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-m);
  padding:14px;
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:14px 12px;
}
.stat-card .num{font-family:var(--font-display); font-size:26px; font-weight:700;}
.stat-card .lbl{font-size:11.5px; color:var(--muted); margin-top:2px;}
.stat-card.accent{border-color:rgba(47,212,176,.35); background:linear-gradient(180deg, rgba(47,212,176,.10), rgba(47,212,176,.02));}
.stat-card.warn{border-color:rgba(245,166,35,.35); background:linear-gradient(180deg, rgba(245,166,35,.10), rgba(245,166,35,.02));}

.quick-actions{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-top:12px;}
.quick-actions button{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:10px 14px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap;
}
.quick-actions button svg{width:15px;height:15px;}
.quick-actions button:active{transform:scale(.97);}

.list{display:flex; flex-direction:column; gap:10px; margin-top:2px;}
.item{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:13px 14px; display:flex; flex-direction:column; gap:8px;
}
.item .row1{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.item .who{font-weight:700; font-size:14.5px;}
.item .meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
.badge{
  font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap;
  border:1px solid transparent;
}
.badge.agendado{background:rgba(91,141,239,.15); color:#8fb0f5; border-color:rgba(91,141,239,.3);}
.badge.confirmado{background:rgba(47,212,176,.15); color:var(--primary); border-color:rgba(47,212,176,.3);}
.badge.concluido{background:rgba(255,255,255,.08); color:#c7cbdb; border-color:var(--border);}
.badge.cancelado{background:rgba(255,107,107,.14); color:var(--danger); border-color:rgba(255,107,107,.3);}
.badge.noshow{background:rgba(245,166,35,.15); color:var(--warn); border-color:rgba(245,166,35,.3);}

.item .actions{display:flex; gap:6px; flex-wrap:wrap;}
.item .actions button{
  font-size:12px; font-weight:600; padding:7px 10px; border-radius:9px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
}
.item .actions button.primary{background:var(--primary); border-color:var(--primary); color:var(--primary-ink);}
.item .actions button.danger{background:rgba(255,107,107,.12); border-color:rgba(255,107,107,.3); color:var(--danger);}

.empty{
  text-align:center; padding:34px 16px; color:var(--muted); font-size:13.5px;
  border:1px dashed var(--border); border-radius:var(--radius-m);
}
.empty b{display:block; color:var(--text); font-size:14.5px; margin-bottom:4px; font-family:var(--font-display);}

.opportunity{
  background:linear-gradient(180deg, rgba(245,166,35,.08), transparent);
  border:1px solid rgba(245,166,35,.25);
}
.opportunity .who{color:var(--warn);}
.attention-item{border-color:rgba(255,107,107,.28); background:linear-gradient(180deg, rgba(255,107,107,.07), transparent);}

/* search */
.search-wrap{position:relative; margin-top:4px;}
.search-wrap input{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:12px 14px 12px 40px; border-radius:var(--radius-m); font-size:14px;
}
.search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px;height:16px; color:var(--muted);}

.tabs{display:flex; gap:8px; margin-top:12px; overflow-x:auto;}
.tabs button{
  flex:0 0 auto; padding:8px 13px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--muted); font-size:12.5px; font-weight:600;
}
.tabs button.active{background:var(--primary); border-color:var(--primary); color:var(--primary-ink);}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:12px 13px; border-radius:var(--radius-s); font-size:14.5px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical; min-height:64px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.hint{font-size:11.5px; color:var(--muted); margin-top:5px;}
.radio-group{display:flex; gap:8px; flex-wrap:wrap;}
.radio-chip{
  padding:9px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2);
  font-size:12.5px; color:var(--muted); font-weight:600;
}
.radio-chip.active{background:var(--primary); border-color:var(--primary); color:var(--primary-ink);}

.btn{
  width:100%; padding:14px; border-radius:var(--radius-m); border:none; font-weight:700; font-size:14.5px;
  background:var(--primary); color:var(--primary-ink);
}
.btn:active{transform:scale(.985);}
.btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn.danger{background:rgba(255,107,107,.14); color:var(--danger); border:1px solid rgba(255,107,107,.3);}
.btn:disabled{opacity:.55;}
.btn-row{display:flex; gap:10px; margin-top:6px;}
.btn-row .btn{flex:1;}

/* toggle */
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .t-label{font-size:14px; font-weight:600;}
.toggle-row .t-sub{font-size:12px; color:var(--muted); margin-top:2px;}
.switch{width:44px; height:26px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); position:relative; flex:0 0 auto;}
.switch.on{background:var(--primary); border-color:var(--primary);}
.switch .knob{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s ease;}
.switch.on .knob{left:20px;}

/* menu list (Mais) */
.menu-list{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
.menu-item{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:14px; text-align:left;
}
.menu-item .ic{width:38px; height:38px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.menu-item .txt{flex:1;}
.menu-item .txt .t1{font-weight:700; font-size:14.5px;}
.menu-item .txt .t2{font-size:12px; color:var(--muted); margin-top:1px;}
.menu-item svg.chev{color:var(--muted); width:16px;height:16px;}

.subheader{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.backbtn{width:36px;height:36px;border-radius:10px;background:var(--surface); border:1px solid var(--border); color:var(--text); display:flex;align-items:center;justify-content:center;}

/* bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  display:flex; justify-content:center;
}
.bottomnav-inner{
  width:100%; max-width:560px; display:flex; align-items:center;
  background:rgba(22,27,46,.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  gap:2px;
}
.navbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--muted); padding:6px 2px; border-radius:12px; font-size:10.5px; font-weight:600;
}
.navbtn.active{color:var(--primary);}
.navbtn svg{width:21px; height:21px;}
.fab{
  width:52px; height:52px; border-radius:16px; background:var(--primary); color:var(--primary-ink);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin:0 2px;
  box-shadow:0 8px 20px rgba(47,212,176,.35); border:none;
}
.fab svg{width:24px;height:24px;}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(6,8,16,.6); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.open{display:flex;}
.modal{
  width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  background:var(--surface); border-radius:22px 22px 0 0; border:1px solid var(--border); border-bottom:none;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  animation:slideup .2s ease;
}
@keyframes slideup{from{transform:translateY(24px); opacity:.6;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.modal-close{width:32px;height:32px;border-radius:10px;background:var(--surface-2); border:1px solid var(--border); color:var(--muted); display:flex;align-items:center;justify-content:center;}

.toast-wrap{position:fixed; top:14px; left:0; right:0; display:flex; justify-content:center; z-index:80; pointer-events:none;}
.toast{
  background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:10px 16px;
  border-radius:999px; font-size:13px; font-weight:600; box-shadow:0 10px 24px rgba(0,0,0,.35);
  opacity:0; transform:translateY(-8px); transition:all .2s ease;
}
.toast.show{opacity:1; transform:translateY(0);}

.notif-panel{
  position:fixed; top:0; right:0; bottom:0; width:min(340px,86vw); background:var(--surface); z-index:60;
  border-left:1px solid var(--border); transform:translateX(100%); transition:transform .2s ease; padding:18px; overflow-y:auto;
}
.notif-panel.open{transform:translateX(0);}
.notif-scrim{position:fixed; inset:0; background:rgba(6,8,16,.5); z-index:55; display:none;}
.notif-scrim.open{display:block;}

.plan-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); margin-top:2px;}
.plan-pill.premium{background:rgba(47,212,176,.14); color:var(--primary); border-color:rgba(47,212,176,.3);}

.locked{text-align:center; padding:40px 18px; border:1px dashed var(--border); border-radius:var(--radius-m); color:var(--muted); font-size:13.5px;}
.locked b{display:block; color:var(--text); font-family:var(--font-display); font-size:15px; margin-bottom:6px;}

@media (min-width:560px){
  #clientAppRoot{border-left:1px solid var(--border); border-right:1px solid var(--border);}
}

/* ---- Access gate & Admin panel ---- */
.gate-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.gate-card{width:100%; max-width:400px;}
.gate-card .mark-lg{
  width:52px; height:52px; border-radius:14px; margin:0 auto 14px;
  background:linear-gradient(135deg,var(--primary),var(--info));
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; color:#06131f; font-size:22px;
}
.gate-card h2{text-align:center; font-size:19px;}
.gate-card .sub{text-align:center; color:var(--muted); font-size:13px; margin:6px 0 20px;}
.gate-msg{padding:12px 14px; border-radius:12px; font-size:13px; margin-bottom:14px; border:1px solid var(--border);}
.gate-msg.error{background:rgba(255,107,107,.1); border-color:rgba(255,107,107,.3); color:var(--danger);}
.gate-msg.warn{background:rgba(245,166,35,.1); border-color:rgba(245,166,35,.3); color:var(--warn);}
.gate-footer{text-align:center; margin-top:18px; font-size:12px; color:var(--muted);}
.gate-footer button{background:none; border:none; color:var(--primary); font-weight:600; font-size:12px;}
.disclosure{font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}

#adminRoot{max-width:900px; margin:0 auto; padding:0 0 60px;}
.admin-topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; background:rgba(14,18,32,.97); backdrop-filter:blur(6px); border-bottom:1px solid var(--border);
}
.admin-topbar .brand h1{font-size:16px;}
.admin-topbar .brand .tag{color:var(--warn); font-weight:700;}
.admin-main{padding:16px 20px 40px;}
.admin-tabs{display:flex; gap:8px; margin-bottom:18px; overflow-x:auto;}
.admin-tabs button{
  flex:0 0 auto; padding:9px 14px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--muted); font-size:13px; font-weight:700;
}
.admin-tabs button.active{background:var(--warn); border-color:var(--warn); color:#251900;}
.kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;}
@media (min-width:520px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.table-list{display:flex; flex-direction:column; gap:10px;}
.trow{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 14px;
}
.trow .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.trow .name{font-weight:700; font-size:14.5px;}
.trow .sub{font-size:12px; color:var(--muted); margin-top:2px;}
.status-pill{font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap;}
.status-pill.ativo{background:rgba(47,212,176,.15); color:var(--primary);}
.status-pill.bloqueado{background:rgba(255,107,107,.14); color:var(--danger);}
.status-pill.gratuito{background:rgba(91,141,239,.15); color:#8fb0f5;}
.status-pill.pago{background:rgba(245,166,35,.15); color:var(--warn);}
</style>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATIVVO">
<link rel="apple-touch-icon" href="./icon.svg">
</head>
<body>

<div id="clientAppRoot">
  <header class="topbar">
    <div class="brand">
      <div class="mark">A</div>
      <div>
        <h1>ATIVVO</h1>
        <div class="tag">Seu negócio sempre em movimento</div>
      </div>
    </div>
    <button class="iconbtn" onclick="Notif.open()" aria-label="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="dot" id="notifDot"></span>
    </button>
  </header>

  <main>
    <!-- HOJE -->
    <section class="screen" id="screen-hoje"></section>
    <!-- AGENDA -->
    <section class="screen" id="screen-agenda"></section>
    <!-- CLIENTES -->
    <section class="screen" id="screen-clientes"></section>
    <!-- INSIGHTS -->
    <section class="screen" id="screen-insights"></section>
    <!-- MAIS -->
    <section class="screen" id="screen-mais"></section>
  </main>
</div>

<nav class="bottomnav" id="bottomNav">
  <div class="bottomnav-inner">
    <button class="navbtn" data-nav="hoje" onclick="Nav.go('hoje')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Hoje</span>
    </button>
    <button class="navbtn" data-nav="agenda" onclick="Nav.go('agenda')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>Agenda</span>
    </button>
    <button class="fab" onclick="Modals.openQuickAdd()" aria-label="Ação rápida">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="navbtn" data-nav="clientes" onclick="Nav.go('clientes')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Clientes</span>
    </button>
    <button class="navbtn" data-nav="insights" onclick="Nav.go('insights')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M12 19V5M20 19v-7"/></svg>
      <span>Insights</span>
    </button>
    <button class="navbtn" data-nav="mais" onclick="Nav.go('mais')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>Mais</span>
    </button>
  </div>
</nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)Modals.close()">

/* ---------------------------- UTILS ---------------------------- */
const Utils = {
  uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  esc(str){
    if(str===undefined||str===null) return '';
    return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  },
  money(v){
    v = Number(v)||0;
    return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  },
  dateBR(iso){
    if(!iso) return '—';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  },
  weekdayShort(iso){
    const d = new Date(iso+'T00:00:00');
    return ['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()];
  },
  daysBetween(isoA, isoB){
    const a = new Date(isoA+'T00:00:00'), b = new Date(isoB+'T00:00:00');
    return Math.round((b-a) / 86400000);
  },
  addMinutes(time, mins){
    const [h,m] = time.split(':').map(Number);
    const total = h*60+m+Number(mins||0);
    const hh = String(Math.floor((total/60)%24)).padStart(2,'0');
    const mm = String(total%60).padStart(2,'0');
    return `${hh}:${mm}`;
  },
  isBirthdayToday(iso){
    if(!iso) return false;
    const today = new Date();
    const b = new Date(iso+'T00:00:00');
    return b.getDate()===today.getDate() && b.getMonth()===today.getMonth();
  },
  debounce(fn, ms){
    let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); };
  },
  monthKey(iso){ return (iso||'').slice(0,7); }
};

/* ---------------------------- STORAGE LAYER ----------------------------
   Antes: dados só em localStorage. Agora: localStorage guarda somente uma
   CÓPIA-CACHE local (para abrir a tela rápido e evitar tela em branco caso
   a rede caia por um instante) — a fonte de verdade é o Postgres/Supabase.
   Nenhuma decisão de acesso é tomada a partir deste cache: ele é só uma
   otimização de exibição. */
const Storage = {
  KEY: 'ativvo_cache_v2',
  get(){
    try{
      const raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ console.error('Storage.get falhou', e); return null; }
  },
  set(data){
    try{ localStorage.setItem(this.KEY, JSON.stringify(data)); return true; }
    catch(e){ console.error('Storage.set falhou (cache local apenas)', e); return false; }
  }
};

/* ---------------------------- STATE ----------------------------
   Mesmo formato de sempre (camelCase) para não quebrar Render/Modals/
   EventEngine. Agora é hidratado a partir do Supabase em DataSync.hydrate()
   e mantido sincronizado por Realtime — ver módulo DataSync mais abaixo. */
const State = {
  data: null,
  emptyData(){
    return {
      clients: [], services: [], appointments: [], returns: [], transactions: [],
      dismissed: [],
      settings: { defaultReminder:'24h', notifAttention:true, notifOpportunities:true }
    };
  },
  loadCacheOnly(){
    // usado só para exibir algo instantaneamente antes da rede responder
    this.data = Object.assign(this.emptyData(), Storage.get() || {});
  },
  saveCache(){
    Storage.set(this.data);
  },
  clearCache(){
    localStorage.removeItem(Storage.KEY);
  }
};

/* ---------------------------- MAPEADORES DB (snake_case) <-> APP (camelCase) ----
   Isolam o formato das tabelas Postgres do resto do app, que continua
   trabalhando exatamente como antes (a.clientId, a.serviceId, etc.). */
const Mapper = {
  client:  { in:r=>({id:r.id, name:r.name, phone:r.phone||'', birthday:r.birthday||'', notes:r.notes||'', createdAt:(r.created_at||'').slice(0,10)}),
             out:c=>({name:c.name, phone:c.phone, birthday:c.birthday||null, notes:c.notes}) },
  service: { in:r=>({id:r.id, name:r.name, duration:r.duration, price:Number(r.price)}),
             out:s=>({name:s.name, duration:Number(s.duration), price:Number(s.price)}) },
  appointment: { in:r=>({id:r.id, clientId:r.client_id, serviceId:r.service_id||'', date:r.date, time:r.time,
             duration:r.duration, price:Number(r.price), status:r.status, notes:r.notes||'', createdAt:(r.created_at||'').slice(0,10)}),
             out:a=>({client_id:a.clientId, service_id:a.serviceId||null, date:a.date, time:a.time,
             duration:Number(a.duration), price:Number(a.price), notes:a.notes||''}) },
  ret: { in:r=>({id:r.id, clientId:r.client_id, date:r.date, time:r.time||'', reason:r.reason||'', reminder:r.reminder, done:r.done, createdAt:(r.created_at||'').slice(0,10)}),
             out:r=>({client_id:r.clientId, date:r.date, time:r.time||'', reason:r.reason||'', reminder:r.reminder||'none'}) },
  tx: { in:r=>({id:r.id, type:r.type, description:r.description||'', value:Number(r.value), date:r.date, category:r.category||'Geral'}),
             out:t=>({type:t.type, description:t.description||'', value:Number(t.value), date:t.date, category:t.category||'Geral'}) }
};

/* ---------------------------- REPO (CRUD por domínio, agora via Supabase) ----------
   Mesmos nomes de método de antes; agora são assíncronos (Promises) e
   escrevem direto no Postgres. RLS garante que cada usuário só enxerga e
   altera seus próprios registros — não há filtro manual de user_id aqui
   além do necessário para o INSERT (o Postgres recusa qualquer tentativa
   de gravar em nome de outro usuário). Em caso de falha de rede/servidor,
   a função lança erro e mostra um aviso — nada é perdido nem aplicado
   silenciosamente sem confirmação do banco. */
const Repo = {
  async _insert(table, row, mapOut){
    const payload = Object.assign({user_id: CurrentUser.uid()}, mapOut(row));
    const {data, error} = await sb.from(table).insert(payload).select().single();
    if(error) throw error;
    return data;
  },
  async _update(table, id, patch){
    const {data, error} = await sb.from(table).update(patch).eq('id', id).select().single();
    if(error) throw error;
    return data;
  },
  async _delete(table, id){
    const {error} = await sb.from(table).delete().eq('id', id);
    if(error) throw error;
  },

  // ---- clientes ----
  async addClient(c){
    const row = await this._insert('clients', c, Mapper.client.out);
    const client = Mapper.client.in(row);
    State.data.clients.push(client);
    State.saveCache();
    return client;
  },
  async updateClient(id, patch){
    const current = State.data.clients.find(x=>x.id===id);
    const merged = Object.assign({}, current, patch);
    const row = await this._update('clients', id, Mapper.client.out(merged));
    const updated = Mapper.client.in(row);
    Object.assign(current, updated);
    State.saveCache();
    return current;
  },
  getClient(id){ return State.data.clients.find(c=>c.id===id); },
  searchClients(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return [...State.data.clients].sort((a,b)=>a.name.localeCompare(b.name));
    return State.data.clients.filter(c =>
      c.name.toLowerCase().includes(q) || (c.phone||'').includes(q)
    ).sort((a,b)=>a.name.localeCompare(b.name));
  },
  clientLastConcludedDate(clientId){
    const list = State.data.appointments
      .filter(a=>a.clientId===clientId && a.status==='concluido')
      .sort((a,b)=>(a.date+a.time)<(b.date+b.time)?1:-1);
    return list[0] ? list[0].date : null;
  },
  clientHasFuturePending(clientId){
    const today = Utils.todayISO();
    const futureAppt = State.data.appointments.some(a =>
      a.clientId===clientId && ['agendado','confirmado'].includes(a.status) && a.date>=today);
    const futureReturn = State.data.returns.some(r =>
      r.clientId===clientId && !r.done && r.date>=today);
    return futureAppt || futureReturn;
  },

  // ---- serviços ----
  async addService(s){
    const row = await this._insert('services', s, Mapper.service.out);
    const svc = Mapper.service.in(row);
    State.data.services.push(svc);
    State.saveCache();
    return svc;
  },
  async updateService(id, patch){
    const current = State.data.services.find(x=>x.id===id);
    const merged = Object.assign({}, current, patch);
    const row = await this._update('services', id, Mapper.service.out(merged));
    Object.assign(current, Mapper.service.in(row));
    State.saveCache();
    return current;
  },
  async deleteService(id){
    await this._delete('services', id);
    State.data.services = State.data.services.filter(s=>s.id!==id);
    State.saveCache();
  },

  // ---- atendimentos ----
  async addAppointment(a){
    const row = await this._insert('appointments', a, Mapper.appointment.out);
    const appt = Mapper.appointment.in(row);
    State.data.appointments.push(appt);
    State.saveCache();
    return appt;
  },
  async updateAppointment(id, patch){
    const current = State.data.appointments.find(x=>x.id===id);
    const merged = Object.assign({}, current, patch);
    const dbPatch = Object.assign(Mapper.appointment.out(merged), patch.status? {status:patch.status} : {});
    const row = await this._update('appointments', id, dbPatch);
    Object.assign(current, Mapper.appointment.in(row));
    State.saveCache();
    return current;
  },
  async setAppointmentStatus(id, status){
    return this.updateAppointment(id, {status});
  },
  appointmentsForDate(iso){
    return State.data.appointments.filter(a=>a.date===iso).sort((a,b)=>a.time<b.time?-1:1);
  },
  upcomingAppointments(){
    const today = Utils.todayISO();
    return State.data.appointments
      .filter(a=>a.date>=today && a.status!=='cancelado')
      .sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
  },

  // ---- retornos ----
  async addReturn(r){
    const row = await this._insert('returns', r, Mapper.ret.out);
    const ret = Mapper.ret.in(row);
    State.data.returns.push(ret);
    State.saveCache();
    return ret;
  },
  async markReturnDone(id){
    const row = await this._update('returns', id, {done:true});
    const r = State.data.returns.find(x=>x.id===id);
    Object.assign(r, Mapper.ret.in(row));
    State.saveCache();
    return r;
  },
  async deleteReturn(id){
    await this._delete('returns', id);
    State.data.returns = State.data.returns.filter(r=>r.id!==id);
    State.saveCache();
  },

  // ---- financeiro (RLS também exige plano com "financeiro" habilitado) ----
  async addTransaction(t){
    const row = await this._insert('transactions', t, Mapper.tx.out);
    const tx = Mapper.tx.in(row);
    State.data.transactions.push(tx);
    State.saveCache();
    return tx;
  },
  async deleteTransaction(id){
    await this._delete('transactions', id);
    State.data.transactions = State.data.transactions.filter(t=>t.id!==id);
    State.saveCache();
  },
  monthSummary(monthKey){
    monthKey = monthKey || Utils.monthKey(Utils.todayISO());
    const txs = State.data.transactions.filter(t=>Utils.monthKey(t.date)===monthKey);
    const receita = txs.filter(t=>t.type==='receita').reduce((s,t)=>s+t.value,0);
    const despesa = txs.filter(t=>t.type==='despesa').reduce((s,t)=>s+t.value,0);
    const concluidos = State.data.appointments.filter(a=>Utils.monthKey(a.date)===monthKey && a.status==='concluido').length;
    return {receita, despesa, resultado:receita-despesa, concluidos, txs: txs.sort((a,b)=>a.date<b.date?1:-1)};
  }
};

/* ---------------------------- EVENT ENGINE ----------------------------
   EVENTO → CONTEXTO → PRIORIDADE → AÇÃO
   Gera: oportunidades e itens de atenção, evitando duplicidade e ruído. */
const EventEngine = {
  OPPORTUNITY_DAYS: 30,
  ATTENTION_DAYS: 7,

  opportunities(){
    const today = Utils.todayISO();
    const out = [];
    const seen = new Set();

    // retorno vencido / retorno hoje
    State.data.returns.forEach(r=>{
      if(r.done) return;
      const client = Repo.getClient(r.clientId);
      if(!client) return;
      if(r.date < today){
        out.push({id:'ret-late-'+r.id, kind:'retorno_vencido', priority:3,
          title:`Retorno atrasado: ${client.name}`,
          detail:`Retorno era em ${Utils.dateBR(r.date)}${r.reason? ' — '+r.reason:''}.`,
          clientId:client.id, refId:r.id});
      } else if(r.date === today){
        out.push({id:'ret-today-'+r.id, kind:'retorno_hoje', priority:2,
          title:`Retorno hoje: ${client.name}`,
          detail:r.reason || 'Retorno agendado para hoje.',
          clientId:client.id, refId:r.id});
      }
    });

    // clientes sem retorno após atendimento concluído / muito tempo sem atendimento
    State.data.clients.forEach(c=>{
      const last = Repo.clientLastConcludedDate(c.id);
      if(!last) return;
      const dias = Utils.daysBetween(last, today);
      if(dias >= this.OPPORTUNITY_DAYS && !Repo.clientHasFuturePending(c.id)){
        const key = 'noret-'+c.id;
        if(seen.has(key)) return;
        seen.add(key);
        out.push({id:key, kind:'sem_retorno', priority:1,
          title:`${c.name} está há ${dias} dias sem novo atendimento`,
          detail:`Último atendimento em ${Utils.dateBR(last)}. Considere sugerir um retorno.`,
          clientId:c.id});
      }
    });

    return out.filter(o=>!State.data.dismissed.includes(o.id))
      .sort((a,b)=>b.priority-a.priority);
  },

  attention(){
    const today = Utils.todayISO();
    const out = [];
    State.data.appointments.forEach(a=>{
      if(!['cancelado','no-show'].includes(a.status)) return;
      const dias = Utils.daysBetween(a.date, today);
      if(dias < 0 || dias > this.ATTENTION_DAYS) return;
      const client = Repo.getClient(a.clientId);
      const id = 'att-'+a.id;
      if(State.data.dismissed.includes(id)) return;
      out.push({id, kind:a.status, priority: a.status==='no-show'?2:1,
        title: a.status==='no-show' ? `Não compareceu: ${client? client.name:'Cliente'}` : `Cancelado: ${client? client.name:'Cliente'}`,
        detail:`Atendimento de ${Utils.dateBR(a.date)} às ${a.time}.`,
        apptId:a.id, clientId:a.clientId});
    });
    return out.sort((a,b)=>b.priority-a.priority);
  },

  dismiss(id){
    if(!State.data.dismissed.includes(id)) State.data.dismissed.push(id);
    State.saveCache();
  },

  insightsCounts(){
    const today = Utils.todayISO();
    const from = new Date(); from.setDate(from.getDate()-30);
    const fromISO = from.toISOString().slice(0,10);
    const cancelamentos = State.data.appointments.filter(a=>a.status==='cancelado' && a.date>=fromISO && a.date<=today).length;
    const noshow = State.data.appointments.filter(a=>a.status==='no-show' && a.date>=fromISO && a.date<=today).length;
    const oportunidades = this.opportunities().length;
    const semRetornoAgendado = State.data.clients.filter(c=>{
      const last = Repo.clientLastConcludedDate(c.id);
      return last && !Repo.clientHasFuturePending(c.id);
    }).length;
    return {cancelamentos, noshow, oportunidades, semRetornoAgendado};
  }
};

/* ---------------------------- CONTA / SESSÃO DO ASSINANTE (Supabase Auth real) ----
   Sessão de verdade: token JWT emitido pelo Supabase Auth, renovado
   automaticamente pelo SDK e validado no servidor a cada chamada — o
   usuário nunca "vira outro usuário" editando o navegador, porque cada
   linha das tabelas só é liberada pelo Postgres (RLS) para o dono do
   auth.uid() correspondente. */
const CurrentUser = {
  session: null,
  profile: null,
  subscription: null,     // versão segura: sem datas/status para profissional
  plan: null,              // versão segura: plano/preço/descrição
  financeiroLiberado: false,
  isAdmin: false,
  businessId: null,
  uid(){ return this.session?.user?.id || null; },
  email(){ return this.session?.user?.email || ''; },
  async refresh(){
    const {data:{session}} = await sb.auth.getSession();
    this.session = session || null;
    if(!this.session){ this.profile=null; this.subscription=null; this.plan=null; this.financeiroLiberado=false; this.isAdmin=false; this.businessId=null; return; }
    const uid = this.session.user.id;
    const [memberRes, adminRes] = await Promise.all([
      sb.from('business_members').select('business_id, role').eq('user_id', uid).maybeSingle(),
      sb.from('admin_users').select('user_id').eq('user_id', uid).maybeSingle()
    ]);
    if(memberRes.error) throw memberRes.error;
    this.isAdmin = !!adminRes.data;
    this.businessId = memberRes.data?.business_id || null;
    if(!this.businessId){ this.profile=null; this.subscription=null; this.plan=null; this.financeiroLiberado=false; return; }
    const [bizRes, subRes, settingsRes] = await Promise.all([
      sb.from('businesses').select('id,name,created_at').eq('id', this.businessId).maybeSingle(),
      sb.from('subscriptions').select('plan_id,custom_price,discount_percent,discount_reason').eq('business_id', this.businessId).order('created_at',{ascending:false}).limit(1).maybeSingle(),
      sb.from('business_settings').select('plan,default_reminder,attention_alerts,opportunity_alerts').eq('business_id', this.businessId).maybeSingle()
    ]);
    if(bizRes.error) throw bizRes.error;
    if(subRes.error) throw subRes.error;
    if(settingsRes.error) throw settingsRes.error;
    const biz = bizRes.data;
    const sub = subRes.data;
    const settings = settingsRes.data || {};
    this.profile = biz ? {business_id:biz.id, name:biz.name||this.session.user.user_metadata?.name||'', phone:'', preferences:{defaultReminder:settings.default_reminder||'24h', notifAttention:settings.attention_alerts!==false, notifOpportunities:settings.opportunity_alerts!==false}} : null;
    if(sub){
      const {data:plan} = await sb.from('plans').select('id,name,price,description,features').eq('id',sub.plan_id).maybeSingle();
      this.subscription = {custom_price:sub.custom_price, discount_percent:sub.discount_percent, discount_reason:sub.discount_reason};
      this.plan = plan ? {id:plan.id, name:plan.name, price:plan.price, description:plan.description} : null;
      this.financeiroLiberado = !!(plan?.features?.financeiro);
    } else { this.subscription=null; this.plan=null; this.financeiroLiberado=false; }
  },
  async logout(){
    await sb.auth.signOut();
    this.session=null; this.profile=null; this.subscription=null; this.plan=null; this.financeiroLiberado=false; this.isAdmin=false; this.businessId=null;
  },
  async savePreferences(){
    const businessId = this.businessId;
    if(!businessId) return;
    const prefs = Object.assign({}, State.data.settings, {dismissed: State.data.dismissed});
    const {error} = await sb.from('business_settings').update({
      default_reminder:prefs.defaultReminder||'24h', attention_alerts:prefs.notifAttention!==false, opportunity_alerts:prefs.notifOpportunities!==false
    }).eq('business_id', businessId);
    if(error){ console.error('savePreferences falhou', error); Toast.show('Preferência salva apenas neste dispositivo (sem conexão).'); }
    else if(this.profile) this.profile.preferences = prefs;
  }
};

/* ---------------------------- CONTROLE DE ACESSO ----------------------------
   isAllowed()/hasFinanceiro() aqui são só para a INTERFACE reagir corretamente
   (mostrar/ocultar telas). A garantia de verdade contra um usuário bloqueado
   ou sem plano Premium tentando ler/gravar dados está nas políticas de RLS
   do banco (schema.sql — is_active_user() e subscription_grants()), que
   funcionam mesmo que este JavaScript seja totalmente ignorado ou alterado. */
const Access = {
  isAllowed(){
    if(!CurrentUser.profile) return false;
    return !CurrentUser.profile.blocked;
  },
  reason(){
    if(!CurrentUser.session) return 'not_authenticated';
    if(!CurrentUser.profile) return 'no_profile';
    if(CurrentUser.profile.blocked) return 'blocked';
    return 'ok';
  },
  currentPlan(){ return CurrentUser.plan; },
  hasFinanceiro(){
    return !!CurrentUser.financeiroLiberado;
  },
  effectivePrice(sub, plan){
    if(!sub) return 0;
    const base = (sub.custom_price!==null && sub.custom_price!==undefined) ? Number(sub.custom_price) : Number(plan?.price||0);
    const discount = Number(sub.discount_percent)||0;
    return Math.max(0, base * (1 - discount/100));
  }
};

/* ---------------------------- ADMIN REPO (usuários/planos via Supabase) ---------------
   Substitui o antigo array local. Lê/grava direto no Postgres. Criar e
   excluir LOGIN (auth.users) exige a service_role key — por segurança essa
   chave nunca fica no navegador, então essas duas ações chamam Edge
   Functions (admin-create-user / admin-delete-user) que rodam no servidor
   do Supabase e primeiro confirmam que quem está chamando é mesmo um
   administrador (tabela admin_users) antes de fazer qualquer coisa. */
const AdminRepo = {
  users: [],   // cada item: {profile, subscription, plan, business}
  plans: [],
  async loadAll(){
    const out = await this._authedFetch('admin-list-users', {});
    this.users = Array.isArray(out.users) ? out.users : [];
    this.plans = Array.isArray(out.plans) ? out.plans : [];
  },
  async _authedFetch(path, body){
    const {data:{session}} = await sb.auth.getSession();
    if(!session?.access_token) throw new Error('Sessão administrativa expirada.');
    const res = await fetch(`${SUPABASE_CONFIG.url}/functions/v1/${path}`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`}, body:JSON.stringify(body)
    });
    const out = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(out.detail || out.error || ('Falha ao chamar '+path));
    return out;
  },
  async createUser(payload){ const out=await this._authedFetch('admin-create-user',payload); await this.loadAll(); return out; },
  async deleteUser(userId){ await this._authedFetch('admin-delete-user',{userId}); await this.loadAll(); },
  async toggleBlock(userId, currentlyBlocked){
    const u=this.users.find(x=>x.profile.user_id===userId); if(!u?.subscription) throw new Error('Assinatura não encontrada.');
    const status=currentlyBlocked?'active':'blocked';
    const {error}=await sb.from('subscriptions').update({status}).eq('id',u.subscription.id);
    if(error) throw error; await this.loadAll();
  },
  async updateProfile(userId, patch){
    const u=this.users.find(x=>x.profile.user_id===userId); if(!u?.business?.id) throw new Error('Negócio não encontrado.');
    const dbPatch={}; if('name' in patch) dbPatch.name=patch.name;
    if(Object.keys(dbPatch).length){ const {error}=await sb.from('businesses').update(dbPatch).eq('id',u.business.id); if(error) throw error; }
    await this.loadAll();
  },
  async updateSubscription(userId, patch){
    const u=this.users.find(x=>x.profile.user_id===userId); if(!u?.subscription?.id) throw new Error('Assinatura não encontrada.');
    const {error}=await sb.from('subscriptions').update(patch).eq('id',u.subscription.id);
    if(error) throw error; await this.loadAll();
  },
  async addPlan(p){ const {error}=await sb.from('plans').insert({name:(p.name||'').trim(),price:Number(p.price)||0,billing_period:p.billingPeriod||'mensal',description:(p.description||'').trim(),features:{financeiro:!!p.financeiro}}); if(error) throw error; await this.loadAll(); },
  async updatePlan(id,patch){ const dbPatch={}; if('name'in patch)dbPatch.name=patch.name; if('price'in patch)dbPatch.price=Number(patch.price); if('billingPeriod'in patch)dbPatch.billing_period=patch.billingPeriod; if('description'in patch)dbPatch.description=patch.description; if('financeiro'in patch)dbPatch.features={financeiro:!!patch.financeiro}; const {error}=await sb.from('plans').update(dbPatch).eq('id',id); if(error)throw error; await this.loadAll(); },
  async togglePlanActive(id){ const p=this.plans.find(x=>x.id===id); const {error}=await sb.from('plans').update({active:!p.active}).eq('id',id); if(error)throw error; await this.loadAll(); },
  async deletePlan(id){ const inUse=this.users.some(u=>u.subscription&&u.subscription.plan_id===id); if(inUse)return {error:'in_use'}; const {error}=await sb.from('plans').delete().eq('id',id); if(error)return {error:error.message}; await this.loadAll(); return {ok:true}; },
  kpis(){ const users=this.users, now=new Date(); const ativos=users.filter(u=>!u.profile.blocked).length, bloqueados=users.filter(u=>u.profile.blocked).length; const pagantesAtivos=users.filter(u=>{if(!u.subscription||!u.plan)return false; if(!['active','trialing'].includes(u.subscription.status))return false; if(u.subscription.current_period_end&&new Date(u.subscription.current_period_end)<now)return false; return Access.effectivePrice(u.subscription,u.plan)>0;}); const gratuitos=users.length-pagantesAtivos.length; const mrr=pagantesAtivos.reduce((s,u)=>s+Access.effectivePrice(u.subscription,u.plan),0); return {total:users.length,ativos,bloqueados,gratuitos,pagantes:pagantesAtivos.length,mrr}; }
};

/* ---------------------------- TOAST ---------------------------- */
const Toast = {
  show(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._t);
    this._t = setTimeout(()=>el.classList.remove('show'), 2200);
  }
};

/* ---------------------------- NAV ---------------------------- */
const Nav = {
  current: 'hoje',
  go(screen){
    this.current = screen;
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
    document.getElementById('screen-'+screen).classList.add('active');
    const btn = document.querySelector(`.navbtn[data-nav="${screen}"]`);
    if(btn) btn.classList.add('active');
    Render.screen(screen);
    window.scrollTo(0,0);
  }
};

/* ---------------------------- ACTIONS (mutações + regras de UI) ---------------------------- */
let SAVING = false; // trava simples anti-duplo-clique em submits
function withLock(fn){
  if(SAVING) return;
  SAVING = true;
  try{ fn(); } finally { setTimeout(()=>SAVING=false, 300); }
}
async function withLockAsync(fn){
  if(SAVING) return;
  SAVING = true;
  try{ await fn(); } finally { setTimeout(()=>SAVING=false, 300); }
}

const Actions = {
  async submitClient(ev, id){
    ev.preventDefault();
    await withLockAsync(async ()=>{
      const f = ev.target;
      const name = f.name.value.trim();
      if(!name){ Toast.show('Informe o nome do cliente.'); return; }
      const payload = {name, phone:f.phone.value, birthday:f.birthday.value||null, notes:f.notes.value};
      try{
        if(id) await Repo.updateClient(id, payload); else await Repo.addClient(payload);
        Modals.close();
        Toast.show(id? 'Cliente atualizado.' : 'Cliente cadastrado.');
        Render.refreshCurrent();
      }catch(e){ console.error(e); Toast.show('Não foi possível salvar. Verifique sua internet e tente novamente.'); }
    });
  },
  async submitAppointment(ev, id){
    ev.preventDefault();
    await withLockAsync(async ()=>{
      const f = ev.target;
      if(!f.clientId.value){ Toast.show('Selecione um cliente.'); return; }
      if(!f.date.value || !f.time.value){ Toast.show('Informe data e horário.'); return; }
      const payload = {
        clientId:f.clientId.value, serviceId:f.serviceId.value||null, date:f.date.value, time:f.time.value,
        duration:f.duration.value, price:f.price.value, notes:f.notes.value
      };
      try{
        if(id) await Repo.updateAppointment(id, payload); else await Repo.addAppointment(payload);
        Modals.close();
        Toast.show(id? 'Atendimento atualizado.' : 'Atendimento criado.');
        Render.refreshCurrent();
      }catch(e){ console.error(e); Toast.show('Não foi possível salvar. Verifique sua internet e tente novamente.'); }
    });
  },
  async submitReturn(ev){
    ev.preventDefault();
    await withLockAsync(async ()=>{
      const f = ev.target;
      if(!f.clientId.value){ Toast.show('Selecione um cliente.'); return; }
      if(!f.date.value){ Toast.show('Informe a data do retorno.'); return; }
      try{
        await Repo.addReturn({clientId:f.clientId.value, date:f.date.value, time:f.time.value, reason:f.reason.value, reminder:f.reminder.value});
        Modals.close();
        Toast.show('Retorno criado.');
        Render.refreshCurrent();
      }catch(e){ console.error(e); Toast.show('Não foi possível salvar. Verifique sua internet e tente novamente.'); }
    });
  },
  async submitTransaction(ev, type){
    ev.preventDefault();
    await withLockAsync(async ()=>{
      const f = ev.target;
      const value = Number(f.value.value);
      if(!f.description.value.trim()){ Toast.show('Informe uma descrição.'); return; }
      if(!value || value<=0){ Toast.show('Informe um valor válido.'); return; }
      try{
        await Repo.addTransaction({type, description:f.description.value, value, date:f.date.value, category:f.category.value||'Geral'});
        Modals.close();
        Toast.show(type==='receita'?'Receita registrada.':'Despesa registrada.');
        Render.refreshCurrent();
      }catch(e){
        console.error(e);
        Toast.show('Não foi possível salvar. Se o problema persistir, confirme se seu plano inclui o Financeiro.');
      }
    });
  },
  async submitService(ev, id){
    ev.preventDefault();
    await withLockAsync(async ()=>{
      const f = ev.target;
      if(!f.name.value.trim()){ Toast.show('Informe o nome do serviço.'); return; }
      const payload = {name:f.name.value, duration:f.duration.value, price:f.price.value};
      try{
        if(id) await Repo.updateService(id, payload); else await Repo.addService(payload);
        Modals.close();
        Toast.show('Serviço salvo.');
        Render.refreshCurrent();
      }catch(e){ console.error(e); Toast.show('Não foi possível salvar. Verifique sua internet e tente novamente.'); }
    });
  },

  async confirmAppt(id){
    try{ await Repo.setAppointmentStatus(id,'confirmado'); Toast.show('Atendimento confirmado.'); Render.refreshCurrent(); }

  deleteReturnConfirm(id){

      catch(e){ Toast.show('Não foi possível remover. Tente novamente.'); }
    });
  },
  deleteServiceConfirm(id){
    Modals.confirm('Remover serviço', 'Deseja remover este serviço?', async ()=>{
      try{ await Repo.deleteService(id); Toast.show('Serviço removido.'); Render.refreshCurrent(); }
      catch(e){ Toast.show('Não foi possível remover. Tente novamente.'); }
    });
  },
  deleteTransactionConfirm(id){
    Modals.confirm('Remover lançamento', 'Deseja remover este lançamento financeiro?', async ()=>{
      try{ await Repo.deleteTransaction(id); Toast.show('Lançamento removido.'); Render.refreshCurrent(); }
      catch(e){ Toast.show('Não foi possível remover. Tente novamente.'); }
    });
  },
  dismiss(id){
    EventEngine.dismiss(id);
    Render.refreshCurrent();
    CurrentUser.savePreferences(); // sincroniza "visto" entre dispositivos (melhor esforço)
  },

  toggleSetting(key){
    State.data.settings[key] = !State.data.settings[key];
    State.saveCache();
    Render.refreshCurrent();
    CurrentUser.savePreferences();
  },
  setDefaultReminder(v){
    State.data.settings.defaultReminder = v;
    State.saveCache();
    Render.refreshCurrent();
    CurrentUser.savePreferences();
  },
  logout(){
    Modals.confirm('Sair da conta', 'Deseja sair da sua conta neste dispositivo?', async ()=>{
      DataSync.unsubscribeAll();
      await CurrentUser.logout();
      State.clearCache();
      Boot.route();
    });
  },
  async startCheckout(planId, gateway){
    Toast.show('Abrindo checkout...');
    try{
      const {data:{session}} = await sb.auth.getSession();
      const res = await fetch(`${SUPABASE_CONFIG.url}/functions/v1/create-checkout`, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${session?.access_token||''}`},
        body: JSON.stringify({planId, gateway})
      });
      const out = await res.json();
      if(!res.ok || out.error){
        if(out.error === 'gateway_not_configured'){
          Toast.show('Este gateway de pagamento ainda não foi configurado pelo administrador do sistema.');
        } else {
          Toast.show('Não foi possível iniciar o checkout: ' + (out.detail || out.error || 'erro desconhecido'));
        }
        return;
      }
      window.location.href = out.checkoutUrl;
    }catch(e){
      console.error(e);
      Toast.show('Não foi possível conectar ao servidor de pagamentos agora.');
    }
  },
  submitChangePassword(ev){
    ev.preventDefault();
    withLockAsync(async ()=>{
      const f = ev.target;
      if(f.pass1.value !== f.pass2.value){ Toast.show('As senhas não coincidem.'); return; }
      if(f.pass1.value.length < 6){ Toast.show('Use pelo menos 6 caracteres.'); return; }
      const {error} = await sb.auth.updateUser({password: f.pass1.value});
      if(error){ Toast.show('Não foi possível alterar a senha: '+error.message); return; }
      Modals.close();
      Toast.show('Senha alterada com sucesso.');
    });
  },

  exportData(){
    const blob = new Blob([JSON.stringify(State.data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ativvo-dados.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    Toast.show('Exportação iniciada.');
  },
  wipeDataConfirm(){
    Modals.confirm('Apagar meu cache local', 'Isso limpa apenas a cópia local (cache) deste navegador. Seus dados de verdade continuam salvos no servidor e serão baixados novamente no próximo carregamento. Continuar?', async ()=>{
      State.clearCache();
      Toast.show('Cache local apagado. Recarregando seus dados do servidor...');
      await DataSync.hydrate();
      Render.maisView='menu';
      Boot.route();
    });
  }
};

/* ---------------------------- ACCESS GATE (tela de acesso do assinante) ----------------------------
   Portão de entrada do app do profissional. Confere o e-mail contra a lista de
   assinantes cadastrada pelo administrador. Isso roda inteiramente no
   navegador do próprio usuário (sem servidor), então serve como controle de
   uso combinado dentro da equipe — não é uma barreira de segurança real, já
   que os dados ficam no localStorage do próprio dispositivo. */
const AccessGate = {
  mode: 'login',   // 'login' | 'signup' | 'forgot' | 'reset'
  error: '',
  info: '',

  mount(){
    document.getElementById('clientAppRoot').style.display = 'none';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('adminRoot').style.display = 'none';
    const root = document.getElementById('accessGateRoot');
    root.style.display = 'block';
    this.render(root);
  },

  render(root){
    root = root || document.getElementById('accessGateRoot');

    if(!isSupabaseConfigured()){
      root.innerHTML = `
        <div class="gate-screen"><div class="gate-card card">
          <div class="mark-lg">A</div>
          <h2>Configuração pendente</h2>
          <div class="sub">Seu negócio sempre em movimento</div>
          <div class="gate-msg warn">Este ATIVVO ainda não está ligado a um projeto Supabase. Preencha <code>SUPABASE_CONFIG.url</code> e <code>SUPABASE_CONFIG.anonKey</code> no topo do arquivo (ou nas variáveis de configuração do seu deploy) e rode o script <code>supabase/schema.sql</code> no seu projeto.</div>
          <div class="disclosure">Veja o passo a passo completo em ATIVVO-SAAS-README.md, entregue junto com este arquivo.</div>
        </div></div>`;
      return;
    }

    if(!CurrentUser.profile && CurrentUser.session && Access.reason()==='no_profile'){
      root.innerHTML = `<div class="gate-screen"><div class="gate-card card">
        <div class="mark-lg">A</div><h2>Preparando sua conta…</h2>
        <div class="sub">Isso deve levar só um instante.</div>
      </div></div>`;
      return;
    }

    if(Access.reason()==='blocked'){
      root.innerHTML = `<div class="gate-screen"><div class="gate-card card">
        <div class="mark-lg">A</div>
        <h2>Acesso bloqueado</h2>
        <div class="gate-msg error">${CurrentUser.profile.blocked_reason ? Utils.esc(CurrentUser.profile.blocked_reason) : 'Sua conta foi bloqueada pelo administrador do ATIVVO.'} Entre em contato para regularizar o acesso.</div>
        <button class="btn secondary" onclick="Actions.logout()">Sair</button>
      </div></div>`;
      return;
    }

    let msgHtml = '';
    if(this.error) msgHtml = `<div class="gate-msg error">${Utils.esc(this.error)}</div>`;
    else if(this.info) msgHtml = `<div class="gate-msg warn">${Utils.esc(this.info)}</div>`;

    if(this.mode === 'reset'){
      root.innerHTML = `<div class="gate-screen"><div class="gate-card card">
        <div class="mark-lg">A</div><h2>Definir nova senha</h2>
        <div class="sub">Você chegou aqui pelo link de recuperação de senha</div>
        ${msgHtml}
        <form onsubmit="AccessGate.submitReset(event)">
          <div class="field"><label>Nova senha</label><input type="password" name="pass1" required minlength="6"></div>
          <div class="field"><label>Confirmar nova senha</label><input type="password" name="pass2" required minlength="6"></div>
          <button class="btn" type="submit">Salvar e entrar</button>
        </form>
      </div></div>`;
      return;
    }

    if(this.mode === 'signup'){
      root.innerHTML = `<div class="gate-screen"><div class="gate-card card">
        <div class="mark-lg">A</div><h2>Criar conta no ATIVVO</h2>
        <div class="sub">Seu negócio sempre em movimento</div>
        ${msgHtml}
        <form onsubmit="AccessGate.submitSignup(event)">
          <div class="field"><label>Nome</label><input name="name" required maxlength="80"></div>
          <div class="field"><label>E-mail</label><input type="email" name="email" required></div>
          <div class="field"><label>Senha</label><input type="password" name="password" required minlength="6"></div>
          <button class="btn" type="submit">Criar conta</button>
        </form>
        <div class="gate-footer">Já tem conta? <button onclick="AccessGate.setMode('login')">Entrar</button></div>
      </div></div>`;
      return;
    }

    if(this.mode === 'forgot'){
      root.innerHTML = `<div class="gate-screen"><div class="gate-card card">
        <div class="mark-lg">A</div><h2>Recuperar senha</h2>
        <div class="sub">Enviaremos um link de redefinição por e-mail</div>
        ${msgHtml}
        <form onsubmit="AccessGate.submitForgot(event)">
          <div class="field"><label>E-mail cadastrado</label><input type="email" name="email" required></div>
          <button class="btn" type="submit">Enviar link</button>
        </form>
        <div class="gate-footer"><button onclick="AccessGate.setMode('login')">Voltar para o login</button></div>
      </div></div>`;
      return;
    }

    // mode === 'login'
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-card card">
          <div class="mark-lg">A</div>
          <h2>Entrar no ATIVVO</h2>
          <div class="sub">Seu negócio sempre em movimento</div>
          ${msgHtml}
          <form onsubmit="AccessGate.submitLogin(event)">
            <div class="field"><label>E-mail</label><input type="email" name="email" required placeholder="voce@exemplo.com"></div>
            <div class="field"><label>Senha</label><input type="password" name="password" required></div>
            <button class="btn" type="submit">Entrar</button>
          </form>
          <div class="gate-footer">
            <button onclick="AccessGate.setMode('forgot')">Esqueci minha senha</button> ·
            <button onclick="AccessGate.setMode('signup')">Criar conta</button> ·
            <button onclick="location.hash='#admin'">Sou administrador</button>
          </div>
          <div class="disclosure">Autenticação real via Supabase Auth: sua senha nunca é vista nem guardada por este app — o Supabase cuida do hash e da sessão. Seus dados ficam isolados dos de outros profissionais por políticas de segurança no banco (RLS).</div>
        </div>
      </div>`;
  },

  setMode(m){ this.mode = m; this.error=''; this.info=''; this.render(); },

  async submitLogin(ev){
    ev.preventDefault();
    const f = ev.target;
    this.error=''; this.info='';
    const {error} = await sb.auth.signInWithPassword({email:f.email.value.trim(), password:f.password.value});
    if(error){ this.error = traduzErroAuth(error); this.render(); return; }
    await Boot.onSessionReady();
  },

  async submitSignup(ev){
    ev.preventDefault();
    const f = ev.target;
    this.error=''; this.info='';
    const {data, error} = await sb.auth.signUp({
      email:f.email.value.trim(), password:f.password.value,
      options:{ data:{ name:f.name.value.trim() } }
    });
    if(error){ this.error = traduzErroAuth(error); this.render(); return; }
    if(data.session){
      await Boot.onSessionReady();
    } else {
      this.mode='login';
      this.info = 'Conta criada! Verifique seu e-mail para confirmar o cadastro antes de entrar.';
      this.render();
    }
  },

  async submitForgot(ev){
    ev.preventDefault();
    const f = ev.target;
    const {error} = await sb.auth.resetPasswordForEmail(f.email.value.trim(), {
      redirectTo: window.location.origin + window.location.pathname
    });
    this.mode='login';
    this.info = error ? traduzErroAuth(error) : 'Se esse e-mail existir na nossa base, enviamos um link de recuperação.';
    this.render();
  },

  async submitReset(ev){
    ev.preventDefault();
    const f = ev.target;
    if(f.pass1.value !== f.pass2.value){ this.error='As senhas não coincidem.'; this.render(); return; }
    const {error} = await sb.auth.updateUser({password:f.pass1.value});
    if(error){ this.error = traduzErroAuth(error); this.render(); return; }
    this.mode='login';
    await Boot.onSessionReady();
  }
};

window.AccessGate = AccessGate;
  function traduzErroAuth(error){
  const msg = error?.message || '';
  if(msg.includes('Invalid login credentials')) return 'E-mail ou senha incorretos.';
  if(msg.includes('User already registered')) return 'Já existe uma conta com esse e-mail.';
  if(msg.includes('Password should be at least')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(msg.includes('Email not confirmed')) return 'Confirme seu e-mail antes de entrar (verifique sua caixa de entrada).';
  return msg || 'Não foi possível completar a operação. Verifique sua internet e tente novamente.';
}

/* ---------------------------- ADMIN APP (painel administrativo do SaaS) ----------------------------
   Login real (Supabase Auth) + verificação de pertencimento a admin_users.
   Toda escrita passa pelas políticas de RLS do banco (schema.sql): mesmo que
   alguém adultere este JavaScript no navegador, o Postgres só aceita as
   operações administrativas se auth.uid() realmente estiver em admin_users.
   Criar/excluir LOGIN de um usuário exige a service_role key — por isso
   essas duas ações chamam Edge Functions (admin-create-user/admin-delete-user)
   em vez de serem feitas direto daqui. */
const AdminApp = {
  tab: 'painel',
  loginError: '',

  async mount(){
    document.getElementById('clientAppRoot').style.display = 'none';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('accessGateRoot').style.display = 'none';
    const root = document.getElementById('adminRoot');
    root.style.display = 'block';

    if(!isSupabaseConfigured()){
      root.innerHTML = `<div class="gate-screen"><div class="gate-card card">
        <div class="mark-lg" style="background:linear-gradient(135deg,var(--warn),#ff9d4d);">A</div>
        <h2>Configuração pendente</h2>
        <div class="gate-msg warn">Configure SUPABASE_CONFIG (url/anonKey) e rode supabase/schema.sql antes de usar o painel administrativo.</div>
      </div></div>`;
      return;
    }

    await CurrentUser.refresh();
    if(!CurrentUser.session){ this.renderLogin(root); return; }
    if(!CurrentUser.isAdmin){
      root.innerHTML = `<div class="gate-screen"><div class="gate-card card">
        <div class="mark-lg" style="background:linear-gradient(135deg,var(--warn),#ff9d4d);">A</div>
        <h2>Sem permissão de administrador</h2>
        <div class="gate-msg error">A conta ${Utils.esc(CurrentUser.email())} está autenticada, mas não está cadastrada como administradora do ATIVVO.</div>
        <div class="btn-row">
          <button class="btn secondary" onclick="location.hash=''">Abrir o app</button>
          <button class="btn danger" onclick="Actions.logout()">Sair</button>
        </div>
      </div></div>`;
      return;
    }
    await this.renderShell(root);
  },

  renderLogin(root, error){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-card card">
          <div class="mark-lg" style="background:linear-gradient(135deg,var(--warn),#ff9d4d);">A</div>
          <h2>Painel administrativo</h2>
          <div class="sub">Acesso restrito ao administrador do ATIVVO</div>
          ${error? `<div class="gate-msg error">${Utils.esc(error)}</div>` : ''}
          <form onsubmit="AdminApp.login(event)">
            <div class="field"><label>E-mail</label><input type="email" name="email" required autofocus></div>
            <div class="field"><label>Senha</label><input type="password" name="password" required></div>
            <button class="btn" type="submit">Entrar</button>
          </form>
          <div class="gate-footer"><button onclick="location.hash=''">Voltar para o app</button></div>
          <div class="disclosure">Login real via Supabase Auth (mesma base de autenticação dos profissionais). O que concede privilégio de administrador é a conta estar cadastrada na tabela <code>admin_users</code> — veja o passo "criar primeiro admin" no README/schema.sql.</div>
        </div>
      </div>`;
  },
  async login(ev){
    ev.preventDefault();
    const f = ev.target;
    const {error} = await sb.auth.signInWithPassword({email:f.email.value.trim(), password:f.password.value});
    if(error){ this.renderLogin(document.getElementById('adminRoot'), traduzErroAuth(error)); return; }
    this.tab = 'painel';
    await this.mount();
  },

  async renderShell(root){
    root.innerHTML = `
      <div class="admin-topbar">
        <div class="brand"><h1>ATIVVO <span class="tag">ADMIN</span></h1></div>
        <div style="display:flex; gap:8px;">
          <button class="iconbtn" onclick="location.hash=''" title="Abrir app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="iconbtn" onclick="AdminApp.logout()" title="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
        </div>
      </div>
      <div class="admin-main">
        <div class="admin-tabs">
          <button class="${this.tab==='painel'?'active':''}" onclick="AdminApp.tab='painel'; AdminApp.render();">Painel</button>

        <div class="hint" style="margin-top:6px;">Soma do valor efetivo (preço do plano ou preço personalizado, já com desconto) de assinantes com assinatura ativa/em teste e não vencida.</div>

      <div class="disclosure" style="margin-top:16px;">MRR calculado a partir das tabelas <code>subscriptions</code>/<code>plans</code> no Postgres — reflete o que está registrado no banco, não uma simulação local. A confirmação de pagamento em si (tabela <code>payments</code>) só é gravada pelos webhooks do gateway (ver ATIVVO-SAAS-README.md); pagamento real ainda depende de você configurar Mercado Pago/Stripe.</div>

      return {overdue:true, text:`🔴 Em atraso — vencido há ${days} dia${days===1?'':'s'}`, dateLabel:Utils.dateBR(end)};

    const daysLeft = Utils.daysBetween(today, end);

/* ---------------------------- DATA SYNC (hidratação + tempo real) ----------------------------
   Ao entrar, busca do Postgres tudo que pertence ao usuário autenticado e
   preenche State.data (mesmo formato de sempre). Depois assina mudanças em
   tempo real (Supabase Realtime) nas tabelas do profissional, então uma
   alteração feita no celular aparece automaticamente no computador aberto
   ao mesmo tempo, sem precisar recarregar a página. Requer que o Realtime
   esteja habilitado para essas tabelas no painel do Supabase (ver README). */
const DataSync = {
  channels: [],
  async hydrate(){
    const uid = CurrentUser.uid();
    if(!uid) return;
    State.loadCacheOnly(); // mostra algo instantâneo enquanto a rede responde
    try{
      const [clientsRes, servicesRes, apptsRes, returnsRes, txRes] = await Promise.all([
        sb.from('clients').select('*'),
        sb.from('services').select('*').eq('active', true),
        sb.from('appointments').select('*'),
        sb.from('returns').select('*'),
        sb.from('transactions').select('*')
      ]);
      const firstError = [clientsRes,servicesRes,apptsRes,returnsRes,txRes].find(r=>r.error)?.error;
      if(firstError) throw firstError;

      State.data.clients = clientsRes.data.map(Mapper.client.in);
      State.data.services = servicesRes.data.map(Mapper.service.in);
      State.data.appointments = apptsRes.data.map(Mapper.appointment.in);
      State.data.returns = returnsRes.data.map(Mapper.ret.in);
      State.data.transactions = txRes.data.map(Mapper.tx.in);

      const prefs = (CurrentUser.profile && CurrentUser.profile.preferences) || {};
      State.data.settings = Object.assign(State.emptyData().settings, prefs);
      State.data.dismissed = Array.isArray(prefs.dismissed) ? prefs.dismissed : [];

      State.saveCache();
      this.subscribeRealtime(uid);
      MigrationTool.checkAndOffer();
    }catch(e){
      console.error('Falha ao sincronizar com o servidor', e);
      Toast.show('Não foi possível baixar seus dados agora. Mostrando a última cópia salva neste dispositivo.');
    }
  },
  subscribeRealtime(uid){
    this.unsubscribeAll();
    const tables = [
      {table:'clients', mapper:Mapper.client.in, key:'clients'},
      {table:'appointments', mapper:Mapper.appointment.in, key:'appointments'},
      {table:'returns', mapper:Mapper.ret.in, key:'returns'},
      {table:'transactions', mapper:Mapper.tx.in, key:'transactions'},
      {table:'services', mapper:Mapper.service.in, key:'services'}
    ];
    tables.forEach(({table, mapper, key})=>{
      const channel = sb.channel(`realtime:${table}:${uid}`)
        .on('postgres_changes', {event:'*', schema:'public', table, filter:`business_id=eq.${CurrentUser.businessId}`}, payload=>{
          const arr = State.data[key];
          if(payload.eventType === 'DELETE'){
            State.data[key] = arr.filter(x=>x.id !== payload.old.id);
          } else {
            const mapped = mapper(payload.new);
            const idx = arr.findIndex(x=>x.id===mapped.id);
            if(idx>=0) arr[idx] = mapped; else arr.push(mapped);
          }
          State.saveCache();
          Render.refreshCurrent();
        })
        .subscribe();
      this.channels.push(channel);
    });
  },
  unsubscribeAll(){
    this.channels.forEach(ch=>sb.removeChannel(ch));
    this.channels = [];
  }
};

/* ---------------------------- MIGRAÇÃO DO LOCALSTORAGE (versão antiga) ----------------------------
   O ATIVVO original (antes deste SaaS) guardava tudo em localStorage sob a
   chave 'ativvo_data_v1'. Este módulo detecta esses dados, mostra quantos
   registros existem e só envia ao Supabase depois de confirmação explícita
   do profissional — nunca apaga o localStorage antigo sozinho: quem decide
   apagar, depois de ver que a migração deu certo, é o próprio usuário (em
   Mais > Meus dados). */
const MigrationTool = {
  LEGACY_KEY: 'ativvo_data_v1',
  DONE_KEY: 'ativvo_migration_done',

  hasLegacyData(){
    if(localStorage.getItem(this.DONE_KEY) === '1') return false;
    try{
      const raw = localStorage.getItem(this.LEGACY_KEY);
      if(!raw) return false;
      const parsed = JSON.parse(raw);
      const count = (parsed.clients||[]).length + (parsed.appointments||[]).length + (parsed.returns||[]).length + (parsed.transactions||[]).length;
      return count > 0 ? parsed : false;
    }catch(e){ return false; }
  },
  checkAndOffer(){
    const legacy = this.hasLegacyData();
    if(!legacy) return;
    Modals.open(`${Modals.head('Dados antigos encontrados neste navegador')}
      <p style="color:var(--muted); font-size:14px; line-height:1.6;">
        Encontramos uma versão anterior do ATIVVO (armazenada só neste navegador) com
        <b>${(legacy.clients||[]).length} cliente(s)</b>, <b>${(legacy.appointments||[]).length} atendimento(s)</b>,
        ${(legacy.returns||[]).length} retorno(s) e ${(legacy.transactions||[]).length} lançamento(s) financeiro(s).
        Deseja importar esses dados para a sua conta (${Utils.esc(CurrentUser.email())})? Nada será apagado
        automaticamente — o backup antigo continua neste navegador até você decidir removê-lo.
      </p>
      <div class="btn-row">
        <button class="btn secondary" onclick="Modals.close()">Agora não</button>
        <button class="btn" onclick="MigrationTool.runImport()">Importar agora</button>
      </div>`);
  },
  async runImport(){
    const legacy = this.hasLegacyData();
    if(!legacy){ Modals.close(); return; }
    Modals.open(`${Modals.head('Importando…')}<div class="empty">Enviando seus dados para o servidor. Não feche esta janela.</div>`);
    const idMap = {};
    let ok = 0, fail = 0;
    try{
      for(const c of (legacy.clients||[])){
        try{ const created = await Repo.addClient({name:c.name, phone:c.phone, birthday:c.birthday||null, notes:c.notes}); idMap[c.id] = created.id; ok++; }
        catch(e){ fail++; }
      }
      const svcMap = {};
      for(const s of (legacy.services||[])){
        try{ const created = await Repo.addService({name:s.name, duration:s.duration, price:s.price}); svcMap[s.id] = created.id; ok++; }
        catch(e){ fail++; }
      }
      for(const a of (legacy.appointments||[])){
        if(!idMap[a.clientId]) { fail++; continue; }
        try{
          await Repo.addAppointment({
            clientId:idMap[a.clientId], serviceId: a.serviceId? (svcMap[a.serviceId]||null) : null,
            date:a.date, time:a.time, duration:a.duration, price:a.price, notes:a.notes
          });
          ok++;
        }catch(e){ fail++; }
      }
      for(const r of (legacy.returns||[])){
        if(!idMap[r.clientId]) { fail++; continue; }
        try{ await Repo.addReturn({clientId:idMap[r.clientId], date:r.date, time:r.time, reason:r.reason, reminder:r.reminder}); ok++; }
        catch(e){ fail++; }
      }
      for(const t of (legacy.transactions||[])){
        try{ await Repo.addTransaction({type:t.type, description:t.description, value:t.value, date:t.date, category:t.category}); ok++; }
        catch(e){ fail++; }
      }

      localStorage.setItem(this.DONE_KEY, '1');
      Modals.close();
      Toast.show(`Importação concluída: ${ok} registro(s) enviados${fail? `, ${fail} com falha (verifique manualmente)`:''}.`);
      Render.refreshCurrent();
    }catch(e){
      console.error('Falha geral na migração', e);
      Modals.close();
      Toast.show('A importação foi interrompida por um erro de conexão. Você pode tentar novamente mais tarde — nada foi apagado.');
    }
  },
  clearLegacyConfirm(){
    if(!this.hasLegacyDataIgnoringDoneFlag()){ Toast.show('Não há dados antigos para remover.'); return; }
    Modals.confirm('Remover backup antigo deste navegador', 'Isso apaga só a cópia antiga (pré-SaaS) guardada neste navegador. Só faça isso depois de confirmar que a importação funcionou. Continuar?', ()=>{
      localStorage.removeItem(this.LEGACY_KEY);
      Toast.show('Backup antigo removido deste navegador.');
    });
  },
  hasLegacyDataIgnoringDoneFlag(){
    try{ return !!localStorage.getItem(this.LEGACY_KEY); }catch(e){ return false; }
  }
};

/* ---------------------------- BOOT / ROTEAMENTO ---------------------------- */
const Boot = {
  booting: false,
  async init(){
    window.addEventListener('hashchange', ()=>this.route());
    if(!isSupabaseConfigured()){
      this.route();
      return;
    }
    // detecta o link de recuperação de senha (Supabase adiciona um hash como
    // #access_token=...&type=recovery na URL de retorno do e-mail)
    sb.auth.onAuthStateChange((event)=>{
      if(event === 'PASSWORD_RECOVERY'){
        AccessGate.mode = 'reset';
        AccessGate.mount();
      }
    });
    await this.onSessionReady();
  },
  async onSessionReady(){
    if(this.booting) return;
    this.booting = true;
    try{
      await CurrentUser.refresh();
      if(CurrentUser.session && Access.isAllowed()){
        await DataSync.hydrate();
      }
    } finally {
      this.booting = false;
      this.route();
    }
  },
  route(){
    if(location.hash.startsWith('#admin')){
      AdminApp.mount();
      return;
    }
    if(!isSupabaseConfigured() || !CurrentUser.session || !Access.isAllowed()){
      AccessGate.mount();
      return;
    }
    document.getElementById('accessGateRoot').style.display = 'none';
    document.getElementById('adminRoot').style.display = 'none';
    document.getElementById('clientAppRoot').style.display = '';
    document.getElementById('bottomNav').style.display = '';
    Nav.go(Nav.current || 'hoje');
  }
};

/* ---------------------------- INIT ---------------------------- */
(function init(){
  Boot.init();
})();
</script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(err => console.warn('ATIVVO SW:', err));
  });
}
</script>
